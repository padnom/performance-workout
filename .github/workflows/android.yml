name: Android Release APK

on:
  push:
    paths:
      - "dotnet/**"
      - ".github/workflows/android.yml"
    tags:
      - "android-v*"
  pull_request:
    paths:
      - "dotnet/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      distribute:
        description: "Sign with the existing installation certificate (requires android-release secrets)"
        type: boolean
        default: false
      previous_release_ref:
        description: "Previous distributed Git ref; blank selects previous android-v* tag"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PROJECT: dotnet/src/Performance.App/Performance.App.csproj
  ANDROID_FRAMEWORK: net10.0-android

jobs:
  verify:
    name: Tests, optimized APK and emulator smoke (diagnostic signer)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install workload
        run: dotnet workload install maui-android
      - name: Verify packaging scripts and version
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_REF: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s dotnet/scripts/tests -v
          baseline="${PR_BASE_REF:-${PUSH_BEFORE_REF:-HEAD}}"
          if [[ "$baseline" =~ ^0+$ ]]; then baseline="HEAD"; fi
          python3 dotnet/scripts/verify-version.py --baseline-ref "$baseline"
      - name: Restore and test Release
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore dotnet/Performance.slnx
          for test_project in dotnet/tests/*/*.csproj; do
            dotnet test "$test_project" --configuration Release --no-restore
          done
      - name: Build standalone Release APK
        run: >-
          dotnet build "$ANDROID_PROJECT"
          --configuration Release --framework "$ANDROID_FRAMEWORK"
          -p:AndroidPackageFormats=apk -p:RunAOTCompilation=true -p:PublishTrimmed=true
      - name: Verify signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-apk"
          apk="dotnet/src/Performance.App/bin/Release/$ANDROID_FRAMEWORK/fr.padnom.performance-Signed.apk"
          python3 dotnet/scripts/verify-release-apk.py "$apk" --project "$ANDROID_PROJECT" --build-tools "$ANDROID_HOME/build-tools/36.0.0"
          cp "$apk" "$RUNNER_TEMP/android-apk/performance-release-diagnostic.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the actual Release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 dotnet/scripts/smoke-android.py "$RUNNER_TEMP/android-apk/performance-release-diagnostic.apk" --output "$RUNNER_TEMP/android-smoke"
      - name: Upload diagnostic Release APK
        uses: actions/upload-artifact@v4
        with:
          name: performance-release-diagnostic-not-an-update
          path: ${{ runner.temp }}/android-apk/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-launch-evidence
          path: ${{ runner.temp }}/android-smoke/
          if-no-files-found: warn
          retention-days: 7

  distribution:
    name: Sign verified APK with the existing certificate
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.distribute || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify release version increases
        shell: bash
        env:
          PREVIOUS_RELEASE_REF: ${{ inputs.previous_release_ref }}
        run: |
          set -euo pipefail
          baseline="$PREVIOUS_RELEASE_REF"
          if [[ -z "$baseline" ]]; then
            baseline="$(git describe --tags --match 'android-v*' --abbrev=0 HEAD^ 2>/dev/null || true)"
          fi
          if [[ -z "$baseline" ]]; then baseline="$(git rev-list --max-parents=0 HEAD | head -n 1)"; fi
          python3 dotnet/scripts/verify-version.py --baseline-ref "$baseline" --require-increase
      - uses: actions/download-artifact@v4
        with:
          name: performance-release-diagnostic-not-an-update
          path: ${{ runner.temp }}/android-apk
      - name: Install Android tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platform-tools"'
      - name: Sign using protected credentials
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          required = ('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD')
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Distribution blocked: configure all four existing-certificate secrets in android-release.')
          key = Path(os.environ['RUNNER_TEMP']) / 'android-signing.keystore'
          key.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/android-signing.keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/android-apk/performance-release-update.apk" \
            "$RUNNER_TEMP/android-apk/performance-release-diagnostic.apk"
          python3 dotnet/scripts/verify-release-apk.py "$RUNNER_TEMP/android-apk/performance-release-update.apk" --project "$ANDROID_PROJECT" --build-tools "$ANDROID_HOME/build-tools/36.0.0" --expected-certificate dotnet/scripts/android-signing-certificate.sha256
      - name: Remove transient key
        if: always()
        run: rm -f "$RUNNER_TEMP/android-signing.keystore"
      - name: Upload update APK
        uses: actions/upload-artifact@v4
        with:
          name: performance-release-update
          path: ${{ runner.temp }}/android-apk/performance-release-update.apk
          if-no-files-found: error
          retention-days: 14
